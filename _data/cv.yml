    Projects:
      - name: "MagHarp: In-Car Mid-Air Gesture Interaction by Repurposing Wireless Chargers"
        start_date: 2024-12
        end_date: 2026-06
        summary: "Sole first author, Proc. ACM IMWUT (UbiComp 2026)"
        highlights:
          - "Designed a low-cost seat retrofit (conductive fabric on the seat surface) that turns the driver's body into a near-field antenna, capturing hand-induced perturbations of Qi charging signals without modifying the charger or the phone."
          - "Built a pipeline of background subtraction, harmonic band selection and multi-band stitching, followed by a lightweight CNN-BiLSTM that recognizes 7 gestures (swipe, press, etc.)."
          - "Reached 97.6% average accuracy on 3,500 samples across 5 chargers and 4 phones."

      - name: "SingSprite: Non-Tactile Appliance Interaction for Blind Users"
        start_date: 2024-12
        end_date: 2025-09
        summary: "Second author (first student author), ACM/IEEE SenSys 2026"
        highlights:
          - "Phones and smartwatches identify nearby appliances and their working states from the high-frequency hum of their power supplies, with voice and vibration feedback; no tags or retrofitting needed."
          - "VMD-based noise removal, an FCN-BLSTM autoencoder for low-sampling-rate microphones, and a multi-stage LSTM (HumNet) for joint appliance and state recognition."
          - "End-to-end F1 of 0.95 over 100 appliances and 8 kinds of mobile devices; validated in a user study with 16 blind participants."

      - name: "Non-Intrusive Monitoring of Shared Laboratory Instruments"
        start_date: 2026-02
        end_date: present
        summary: "Back-end recognition algorithms and Home Assistant front-end"
        highlights:
          - "Infers the working state and real-time rotor speed of closed commercial instruments (e.g., high-speed refrigerated centrifuges) from leaked acoustic hum and low-frequency magnetic fluctuations captured by external microphones and magnetometers."
          - "Classifies 4 working states (F1 0.885) and regresses continuous speed (mean error about 5% of full speed) in parallel."
          - "Runs in real time on NVIDIA Jetson with TensorRT, integrated with Home Assistant and a web dashboard for status alerts and reservations; deployed at the SJTU School of Life Sciences."

