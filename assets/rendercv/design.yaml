# RenderCV 2.x design (passed with --design in .github/workflows/render-cv.yml).
# Options: https://docs.rendercv.com/user_guide/yaml_input_structure/design/
design:
  theme: classic
  page:
    size: a4
    show_footer: true
    show_top_note: true
  templates:
    # _data/cv.yml keeps an author line in `summary` for the web CV page;
    # leave SUMMARY out here so the PDF does not print the authors twice.
    publication_entry:
      main_column: |-
        **TITLE**
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: DATE
